<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to A1: English Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a44; --sub:#56607a; --panel:#ffffff; --mist:#eef3f8; --line:#d6dfea;
  --sun:#f2b705; --sun-ink:#3a2c00; --leaf:#2f8f60; --berry:#d94a6e; --sky:#9fd3f0;
  --shadow:0 10px 30px rgba(31,42,68,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#eef2fb; --sub:#a9b3c9; --panel:#1d2433; --mist:#283247; --line:#36425c;
    --sun:#f5c431; --sun-ink:#2b2100; --leaf:#5cc690; --berry:#f07a98;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef2fb; --sub:#a9b3c9; --panel:#1d2433; --mist:#283247; --line:#36425c;
  --sun:#f5c431; --sun-ink:#2b2100; --leaf:#5cc690; --berry:#f07a98;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;position:relative;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}

/* Title */
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(to bottom,rgba(159,211,240,0) 0%,rgba(20,32,58,.35) 100%)}
.title-box{width:min(720px,100%);text-align:center}
.logo{font-family:"Jua",sans-serif;font-size:clamp(52px,11vw,104px);line-height:.95;color:#fff;margin:0;letter-spacing:-.01em;text-shadow:0 4px 0 #1f2a44,0 10px 30px rgba(0,0,0,.25)}
.logo small{display:block;font-size:.34em;margin-top:.35em;color:var(--sun);text-shadow:0 3px 0 #1f2a44}
.tagline{color:#fff;font-size:17px;margin:14px 0 26px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
.path{background:var(--panel);border:none;border-radius:20px;padding:20px 20px 18px;box-shadow:var(--shadow);transition:transform .15s}
.path:hover{transform:translateY(-3px)}
.path h2{margin:0 0 6px;font-size:26px}
.path p{margin:0;color:var(--sub);font-size:15px;line-height:1.55}
.path.enroll{background:var(--sun);color:var(--sun-ink)}
.path.enroll p{color:var(--sun-ink);opacity:.8}
.path .pill{display:inline-block;margin-top:12px;font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.08)}
#resetBtn{margin-top:16px;background:none;border:none;color:#fff;text-decoration:underline;font-size:14px;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.5)}
@media (max-width:560px){.paths{grid-template-columns:1fr}}

/* Modal */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,22,40,.45);padding:20px;z-index:20}
.modal .card{background:var(--panel);border-radius:22px;padding:24px;width:min(420px,100%);box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:24px}
.modal p{margin:0 0 14px;color:var(--sub);line-height:1.55}
.modal input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--mist);color:var(--ink)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:16px;background:var(--mist)}
.btn.primary{background:var(--ink);color:var(--panel)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#status{position:absolute;top:12px;left:12px;width:min(300px,calc(100% - 190px));background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
#status .top{display:flex;align-items:center;gap:8px}
#modeTag{font-family:"Jua",sans-serif;font-size:14px;padding:3px 10px;border-radius:99px;background:var(--mist)}
#lv{font-family:"Jua",sans-serif;font-size:20px;margin-left:auto}
.xpbar{height:8px;border-radius:99px;background:var(--mist);margin:8px 0 2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);width:0;transition:width .5s}
#xpText{font-size:12px;color:var(--sub)}
#quest{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
#quest b{font-family:"Jua",sans-serif;font-weight:400;font-size:17px;display:block}
#quest span{font-size:14px;color:var(--sub);line-height:1.5;display:block;margin-top:2px}
#mapWrap{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#minimap{width:150px;height:150px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);display:block}
#menuBtn{border:none;background:var(--panel);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px}
#prompt{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);border:none;background:var(--ink);color:var(--panel);padding:12px 22px;border-radius:99px;font-size:17px;box-shadow:var(--shadow);font-family:"Jua",sans-serif}
#prompt kbd{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:1px 7px;margin-right:6px;font-family:inherit}
#joy{position:absolute;left:24px;bottom:28px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);touch-action:none;display:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
@media (pointer:coarse){#joy{display:block}#prompt kbd{display:none}#prompt{left:auto;right:24px;transform:none;bottom:60px}}
#help{position:absolute;bottom:12px;left:12px;font-size:13px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
@media (pointer:coarse){#help{display:none}}
#toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:30}
.toast{background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:99px;font-family:"Jua",sans-serif;font-size:16px;box-shadow:var(--shadow);animation:pop .3s ease-out}
.toast.gold{background:var(--sun);color:var(--sun-ink)}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:560px){#status{width:calc(100% - 120px)} #minimap{width:96px;height:96px} #quest span{font-size:13px}}

/* Dialogue */
#dlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100% - 20px));background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:18px 18px 16px;z-index:10;max-height:calc(100% - 40px);overflow:auto}
.who{display:flex;align-items:center;gap:12px}
.face{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Jua",sans-serif;font-size:22px}
.who b{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;display:block}
.who small{color:var(--sub);font-size:13px}
.who .tools{margin-left:auto;display:flex;gap:6px}
.tool{border:none;background:var(--mist);border-radius:10px;padding:7px 10px;font-size:14px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#youLine{margin:14px 0 0;font-size:15px;color:var(--sub);text-align:right}
#youLine:empty{display:none}
#npcLine{font-size:21px;line-height:1.45;margin:12px 0 0;font-family:"Gowun Dodum",sans-serif}
#npcLine em{color:var(--sub);font-style:normal}
#koLine{margin:6px 0 0;color:var(--sub);font-size:15px;line-height:1.5}
#choices{display:grid;gap:8px;margin-top:14px}
.choice{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;font-size:17px;display:flex;gap:10px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .n{font-family:"Jua",sans-serif;color:var(--sub);flex:none}
.choice.wrong{border-color:var(--berry);opacity:.6;text-decoration:line-through}
.choice.right{border-color:var(--leaf);background:var(--mist)}
.choice.close{justify-content:center;background:var(--ink);color:var(--panel);border-color:var(--ink);font-family:"Jua",sans-serif}
#fb{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mist);font-size:15px;line-height:1.5;border-left:4px solid var(--berry)}
#fb.note{border-left-color:var(--sun)}
#fb:empty{display:none}
#dlgMeta{margin-top:10px;font-size:12px;color:var(--sub);text-align:right}
@media (prefers-reduced-motion:reduce){.path,.toast{transition:none;animation:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud" class="hidden">
  <div id="status">
    <div class="top"><span id="modeTag">학교 입학</span><span id="lv">Lv.0</span></div>
    <div class="xpbar"><i id="xpFill"></i></div>
    <div id="xpText">0 / 50 XP</div>
    <div id="quest"><b id="qTitle"></b><span id="qDesc"></span></div>
  </div>
  <div id="mapWrap">
    <canvas id="minimap" width="300" height="300" aria-label="마을 지도"></canvas>
    <button id="menuBtn">처음 화면으로</button>
  </div>
  <div id="joy" aria-hidden="true"><i id="knob"></i></div>
  <button id="prompt" class="hidden"><kbd>E</kbd><span id="promptText">대화하기</span></button>
  <div id="help">이동: WASD 또는 방향키 · 시점: 화면 드래그 · 확대/축소: 마우스 휠 · 대화: E 또는 Space · 선택지: 1~3</div>
</div>

<div id="dlg" class="hidden" role="dialog" aria-live="polite">
  <div class="who">
    <div class="face" id="face">S</div>
    <div><b id="whoName"></b><small id="whoRole"></small></div>
    <div class="tools">
      <button class="tool" id="speakBtn" title="영어 문장 듣기">🔊 듣기</button>
      <button class="tool" id="koBtn" aria-pressed="false">해석</button>
    </div>
  </div>
  <p id="youLine"></p>
  <p id="npcLine"></p>
  <p id="koLine" class="hidden"></p>
  <div id="choices"></div>
  <div id="fb"></div>
  <div id="dlgMeta"></div>
</div>

<div id="title">
  <div class="title-box">
    <h1 class="logo">Road to A1<small>English Town</small></h1>
    <p class="tagline">어학당이 있는 영어 마을에서 사람들과 직접 말해 보세요.</p>
    <div class="paths">
      <button class="path" id="exploreBtn">
        <h2>게임 둘러보기</h2>
        <p>스토리 없이 마을을 자유롭게 걸어 다녀요. 아무 사람에게나 말을 걸어 상황극을 연습할 수 있어요.</p>
        <span class="pill">경험치 없음</span>
      </button>
      <button class="path enroll" id="enrollBtn">
        <h2 id="enrollTitle">학교 입학하기</h2>
        <p>전담 도우미 학생 Mia와 함께 학교부터 가서 차례로 퀘스트를 받아요. 퀘스트를 미루고 돌아다녀도 괜찮아요.</p>
        <span class="pill" id="enrollPill">퀘스트 7개</span>
      </button>
    </div>
    <button id="resetBtn" class="hidden">기록 지우고 처음부터 입학하기</button>
  </div>
</div>

<div id="nameModal" class="modal hidden">
  <div class="card">
    <h3>입학 원서</h3>
    <p>마을 사람들이 부를 영어 이름을 적어 주세요.</p>
    <input id="nameInput" maxlength="16" placeholder="예: Alex" autocomplete="off">
    <div class="row"><button class="btn" id="nameCancel">취소</button><button class="btn primary" id="nameOk">입학하기</button></div>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);

/* ================= DATA ================= */
const NPCS=[
  {id:'mia',name:'Mia',role:'전담 도우미 학생',color:'#e86a92',hair:'#3b2416',pos:[2.6,25.5],rot:Math.PI,buddy:true},
  {id:'parker',name:'Ms. Parker',role:'메이플 어학원 교무실',color:'#4f6bd8',hair:'#c9a46a',pos:[0,-28.2],rot:0},

const D={
 intro:{npc:'mia',steps:[
  {en:'Hi! You must be {name}. I’m Mia. I’ll be your buddy at the language school.',ko:'안녕! 네가 {name}구나. 난 미아야. 어학원에서 네 도우미 학생이 될 거야.',c:[

 register:{npc:'parker',steps:[

function roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function textSprite(text,o){
  o=Object.assign({size:56,color:'#1f2a44',bg:'rgba(255,255,255,.94)',pad:22,scale:0.011},o||{});
  const c=document.createElement('canvas'),x=c.getContext('2d');

  const w=Math.ceil(x.measureText(text).width)+o.pad*2,h=Math.ceil(o.size+o.pad*1.4);
  c.width=w;c.height=h;x.font=f;
  if(o.bg){x.fillStyle=o.bg;roundRect(x,0,0,w,h,h/2.4);x.fill()}
  x.fillStyle=o.color;x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2+3);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false,transparent:true}));
  s.scale.set(w*o.scale,h*o.scale,1);return s;
}

function makePerson(color,hair,seated){

  if(seated){legs.rotation.x=Math.PI/2;legs.position.set(0,0.6,0.3)}else legs.position.y=0.35;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.38,0.78,12),lam(color));body.position.y=1.08;
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.31,16,12),lam('#f1c9a5'));head.position.y=1.72;
  const hairM=new THREE.Mesh(new THREE.SphereGeometry(0.33,16,10,0,Math.PI*2,0,Math.PI/2),lam(hair));hairM.position.y=1.77;hairM.rotation.x=-0.25;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtLine(s){const t=fill(s);const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');return esc.replace(/\*(.+?)\*/g,'<em>$1</em>')}

function openFor(id){
  const n=npcObjs[id].def;
  if(id==='mia'){
    const q=currentQuest();
    if(q&&q.id==='intro')return openDialogue(n,'intro','quest');
    const h=q?MIA_HINT[q.id]:MIA_HINT.done;
    return openNote(n,h[0],h[1],q?'다음 퀘스트: '+q.title:'');
  }
  const list=DLG_BY_NPC[id];
  if(mode==='explore'){
    const did=list.length>1&&npcObjs[id].toggle?list[1]:list[0];
    if(list.length>1)npcObjs[id].toggle=!npcObjs[id].toggle;
    return openDialogue(n,did,'practice');
  }
  const q=currentQuest();
  if(q&&q.npc===id)return openDialogue(n,q.id,'quest');
  const doneHere=list.filter(d=>save.done.includes(d));
  if(doneHere.length)return openDialogue(n,doneHere[doneHere.length-1],'practice');
  const hint=q?(q.id==='intro'?'Mia: 먼저 나랑 인사부터 하자!':'Mia: 지금은 「'+q.title+'」 차례야. '+q.desc):'';
  openNote(n,IDLE[id][0],IDLE[id][1],hint);
}

function choose(c,b){

    dlg.right++;if(dlg.kind==='quest'&&save){save.stats.right++}

    [...$('#choices').children].forEach(x=>x.disabled=true);
    setTimeout(()=>{
      $('#youLine').textContent='You: '+fill(c.t);
      dlg.step++;
      if(dlg.step<dlg.def.steps.length)renderStep();else endDialogue();
    },420);

    dlg.mistakes++;if(dlg.kind==='quest'&&save){save.stats.wrong++}
    b.classList.add('wrong');b.disabled=true;
    const fb=$('#fb');fb.className='';fb.textContent='💡 '+c.fb;

function closeDialogue(){
  if(!dlg)return;
  const d=dlg;dlg=null;
  $('#dlg').classList.add('hidden');
  if(window.speechSynthesis)speechSynthesis.cancel();
  const o=npcObjs[d.npc.id];if(o&&!o.def.buddy)o.turnBack=true;
  if(d.finished&&d.kind==='quest'&&save){
    const q=QUESTS[save.step];const before=levelOf(save.xp);
    save.xp+=q.xp;save.done.push(q.id);save.step++;
    save.log.push({q:q.id,mistakes:d.mistakes,at:Date.now()});if(save.log.length>100)save.log.shift();
    persist();
    toast('퀘스트 완료: '+q.title+'  +'+q.xp+' XP',true);
    const after=levelOf(save.xp);if(after>before)setTimeout(()=>toast('레벨 업! Lv.'+after,true),600);
    const nq=currentQuest();
    if(nq)setTimeout(()=>toast('새 퀘스트: '+nq.title),1300);

    updateHUD();
  }else if(d.finished&&d.kind==='practice'){toast('연습 완료!')}
  else if(save&&mode==='enroll')persist();
}

const camPos=new THREE.Vector3(0,30,60);
const camLook=new THREE.Vector3();
// orbit camera: free yaw, pitch limited to the upper hemisphere
let camYaw=0,camPitch=0.82,camDist=20;
const PITCH_MIN=0.1,PITCH_MAX=1.45,DIST_MIN=8,DIST_MAX=40;
const cv=renderer.domElement,ptrs=new Map();let pinchD=0;
function ptrDist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
cv.addEventListener('pointerdown',e=>{if(!started)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}if(ptrs.size===2)pinchD=ptrDist()});
cv.addEventListener('pointermove',e=>{
  const prev=ptrs.get(e.pointerId);if(!prev)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const d=ptrDist();if(pinchD&&d)camDist=Math.max(DIST_MIN,Math.min(DIST_MAX,camDist*pinchD/d));pinchD=d;return}
  if(ptrs.size===1){camYaw-=(e.clientX-prev.x)*0.006;camPitch=Math.max(PITCH_MIN,Math.min(PITCH_MAX,camPitch+(e.clientY-prev.y)*0.005))}
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0}));
cv.addEventListener('wheel',e=>{if(!started)return;e.preventDefault();camDist=Math.max(DIST_MIN,Math.min(DIST_MAX,camDist*(1+Math.sign(e.deltaY)*0.08)))},{passive:false});
function blocked(x,z){for(const c of colliders){if(x>c.minX-0.35&&x<c.maxX+0.35&&z>c.minZ-0.35&&z<c.maxZ+0.35){if(c.npc&&c.npc==='mia')continue;return true}}return Math.abs(x)>60||Math.abs(z)>60}
let walkT=0;
function update(dt,t){
  if(!started){
    const a=t*0.06;camera.position.set(Math.sin(a)*58,32,Math.cos(a)*58);camera.lookAt(0,0,-4);
    animateWorld(t);return;
  }
  let ix=0,iz=0;
  if(!dlg){
    if(keys.KeyW||keys.ArrowUp)iz-=1;if(keys.KeyS||keys.ArrowDown)iz+=1;
    if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
    ix+=joy.x;iz+=joy.y;
  }
  const len=Math.hypot(ix,iz);
  const p=player.position;
  if(len>0.08){
    const sp=(keys.ShiftLeft||keys.ShiftRight?11:7)*Math.min(1,len);
    const cy=Math.cos(camYaw),sy=Math.sin(camYaw);
    const wx=(ix*cy+iz*sy)/len,wz=(-ix*sy+iz*cy)/len;
    const dx=wx*sp*dt,dz=wz*sp*dt;
    if(!blocked(p.x+dx,p.z))p.x+=dx;
    if(!blocked(p.x,p.z+dz))p.z+=dz;
    const target=Math.atan2(wx,wz);
    player.rotation.y=lerpAngle(player.rotation.y,target,Math.min(1,dt*12));
    walkT+=dt*sp*1.6;
  }else walkT*=0.9;
  player.userData.parts.body.position.y=1.08+Math.abs(Math.sin(walkT))*0.08;

  // buddy follow
  const mia=npcObjs.mia.obj;
  if(mode==='enroll'&&!(dlg&&dlg.npc.id==='mia')){
    const back=new THREE.Vector3(Math.sin(player.rotation.y)*-1.8+Math.cos(player.rotation.y)*1.4,0,Math.cos(player.rotation.y)*-1.8-Math.sin(player.rotation.y)*1.4);
    const tgt=p.clone().add(back);
    const d=mia.position.distanceTo(tgt);
    if(d>0.4){const step=Math.min(d,(d>6?12:7)*dt);const dir=tgt.sub(mia.position).normalize();mia.position.addScaledVector(dir,step);mia.rotation.y=lerpAngle(mia.rotation.y,Math.atan2(dir.x,dir.z),Math.min(1,dt*8));mia.userData.parts.body.position.y=1.08+Math.abs(Math.sin(t*10))*0.07}
    else mia.rotation.y=lerpAngle(mia.rotation.y,Math.atan2(p.x-mia.position.x,p.z-mia.position.z),Math.min(1,dt*4));
  }

  // npc turning
  for(const id in npcObjs){const o=npcObjs[id];if(o.def.buddy||o.def.seated)continue;
    if(o.turnBack){o.targetRot=o.baseRot;o.turnBack=false}
    if(o.targetRot!=null)o.obj.rotation.y=lerpAngle(o.obj.rotation.y,o.targetRot,Math.min(1,dt*6));
  }

  // nearest npc
  nearNpc=null;let best=3.4;
  for(const id in npcObjs){const o=npcObjs[id];if(!o.obj.visible)continue;const d=Math.hypot(o.obj.position.x-p.x,o.obj.position.z-p.z);if(d<best){best=d;nearNpc=id}}
  const pr=$('#prompt');
  if(nearNpc&&!dlg){pr.classList.remove('hidden');$('#promptText').textContent=npcObjs[nearNpc].def.name+'에게 말 걸기'}else pr.classList.add('hidden');

  // quest marker
  const q=currentQuest();
  if(q&&npcObjs[q.npc]){const o=npcObjs[q.npc].obj;marker.visible=true;marker.position.set(o.position.x,(npcObjs[q.npc].def.seated?3.4:3.6)+Math.sin(t*3)*0.15,o.position.z)}else marker.visible=false;

  // camera
  camLook.lerp(new THREE.Vector3(p.x,1.2,p.z),Math.min(1,dt*8));
  const cp=Math.cos(camPitch);
  camera.position.set(camLook.x+Math.sin(camYaw)*cp*camDist,camLook.y+Math.sin(camPitch)*camDist,camLook.z+Math.cos(camYaw)*cp*camDist);
  camera.lookAt(camLook);
  sunL.position.set(p.x+30,50,p.z+20);sunL.target.position.set(p.x,0,p.z);sunL.target.updateMatrixWorld();
  animateWorld(t);
  drawMap(q);
}
function animateWorld(t){scene.traverse(o=>{if(o.userData.flag)o.rotation.y=Math.sin(t*2)*0.12})}
function lerpAngle(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k}

/* ================= MINIMAP ================= */
const mm=$('#minimap'),mx=mm.getContext('2d');
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
let mapColors=null;
function drawMap(q){
  if(!mapColors||Math.random()<0.01)mapColors={panel:cssVar('--panel'),mist:cssVar('--mist'),ink:cssVar('--ink'),sun:cssVar('--sun')};
  const S=mm.width,k=S/124,c=S/2,X=x=>c+x*k,Z=z=>c+z*k;
  mx.clearRect(0,0,S,S);mx.fillStyle='#a9d58f';roundRect(mx,0,0,S,S,30);mx.fill();
  mx.save();roundRect(mx,0,0,S,S,30);mx.clip();
  for(const s of mapShapes){
    if(s.t==='road'){mx.fillStyle='#8a90a0';mx.fillRect(X(s.x-s.w/2),Z(s.z-s.d/2),s.w*k,s.d*k)}
    else if(s.t==='park'){mx.fillStyle='#79b85a';mx.beginPath();mx.arc(X(s.x),Z(s.z),s.r*k,0,7);mx.fill()}
    else if(s.t==='pond'){mx.fillStyle='#5aa9d6';mx.beginPath();mx.arc(X(s.x),Z(s.z),s.r*k,0,7);mx.fill()}
    else if(s.t==='bld'){mx.fillStyle=s.c;mx.fillRect(X(s.x-s.w/2),Z(s.z-s.d/2),s.w*k,s.d*k);if(s.label){mx.font=(S*0.08)+'px sans-serif';mx.textAlign='center';mx.textBaseline='middle';mx.fillText(s.label,X(s.x),Z(s.z))}}
  }
  // npcs
  for(const id in npcObjs){const o=npcObjs[id];if(!o.obj.visible)continue;mx.fillStyle=o.def.color;mx.beginPath();mx.arc(X(o.obj.position.x),Z(o.obj.position.z),S*0.018,0,7);mx.fill()}
  if(q&&npcObjs[q.npc]){const o=npcObjs[q.npc].obj;const r=S*0.045+Math.sin(performance.now()/250)*S*0.008;mx.strokeStyle='#f2b705';mx.lineWidth=S*0.018;mx.beginPath();mx.arc(X(o.position.x),Z(o.position.z),r,0,7);mx.stroke()}
  // player
  const p=player.position,a=player.rotation.y;
  mx.save();mx.translate(X(p.x),Z(p.z));mx.rotate(-a+Math.PI);
  mx.fillStyle='#ffffff';mx.strokeStyle='#1f2a44';mx.lineWidth=S*0.012;
  mx.beginPath();mx.moveTo(0,-S*0.045);mx.lineTo(S*0.032,S*0.032);mx.lineTo(-S*0.032,S*0.032);mx.closePath();mx.fill();mx.stroke();
  mx.restore();mx.restore();
}

/* ================= BOOT ================= */
let lastT=performance.now();
function loop(now){const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;update(dt,now/1000);renderer.render(scene,camera);requestAnimationFrame(loop)}
function boot(){buildWorld();buildPeople();refreshTitle();requestAnimationFrame(loop)}
const fontWait=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('56px "Jua"'),document.fonts.load('16px "Gowun Dodum"')]):Promise.resolve();
let booted=false;const go=()=>{if(!booted){booted=true;boot()}};
fontWait.then(go,go);setTimeout(go,2500);
})();
</script>
