var VO=null;function loadV(){try{VO=speechSynthesis.getVoices().filter(function(v){return /^ru/i.test(v.lang)})[0]||null}catch(e){}}
loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function say(t,cb){try{var busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);if(VO){u.voice=VO;u.lang=VO.lang}else u.lang='ru-RU';u.rate=.85;if(cb){u.onend=cb;setTimeout(cb,2500+t.length*150)}var go=function(){speechSynthesis.resume();speechSynthesis.speak(u)};busy?setTimeout(go,90):go()}catch(e){if(cb)cb()}}
var SOON={karaoke:['노래방 · 곧 만들 상황극','Добрый вечер! Сколько человек?','Dobryy vecher! Skol’ko chelovek?','안녕하세요! 몇 분이세요?'],bench:['벤치 · 곧 만들 상황극','Привет! Как дела?','Privet! Kak dela?','안녕! 잘 지내?']};
var sheet=document.getElementById('sheet');
act.addEventListener('click',function(){if(near)openScene(near)});
function hud(){try{var o=G.xp();xpEl.textContent='⭐ Lv '+o.L+' · 경험치 '+o.x.toFixed(1)}catch(e){}}
function closeScene(){inScene=false;sheet.style.display='none';joy.x=joy.y=0;hud()}
function hookSheet(){[].forEach.call(sheet.querySelectorAll('.snd'),function(b){b.onclick=function(){say(b.getAttribute('data-t'))}});var c=document.getElementById('cl');if(c)c.onclick=closeScene}
function openScene(p){inScene=true;sheet.style.display='block';sheet.scrollTop=0;
 if(p.id=='cafe')runScene({id:'cafe',title:'☕ 카페 · 주문하기',npc:'🧑‍🍳',steps:CAFE,back:closeScene},0,0);else if(p.id=='board')lessons();else if(p.id=='teacher')office();else soon(p)}
function soon(p){var s=SOON[p.id];sheet.innerHTML='<h2>'+p.emoji+' '+s[0]+'</h2><div class="npc"><div class="av">'+p.npc+'</div><div class="bub"><b>'+s[1]+'</b><small>'+s[2]+'</small><small>'+s[3]+'</small></div></div><div class="msg">이 장소의 상황극은 아직 준비 중이에요.</div><div class="row"><button id="lis">🔊 듣기</button><button id="cl" class="p">나가기</button></div>';
 hookSheet();document.getElementById('lis').onclick=function(){say(s[1])}}
function lessons(){var L=[['📖 문법 수업','grammar','A1 필수 규칙 8가지'],['🗣️ 문장 연습 수업','practice','단어로 문장 만들기 · 무한 반복'],['🎯 시험 수업','test','시험을 보면 경험치와 레벨이 올라가요'],['💬 대화 수업','dialog','인사부터 카페·길 묻기까지']],g='Садитесь, пожалуйста. Урок начинается.';
 sheet.innerHTML='<h2>📚 교실 수업 (Урок)</h2><div class="npc"><div class="av">🧑‍🏫</div><div class="bub"><b>'+g+'</b><small>'+rom(g)+'</small><small>앉으세요. 수업을 시작합니다.</small></div></div><div class="msg">어떤 수업을 들을까요?</div>'+
 L.map(function(r){return '<div class="opt"><button class="main" data-g="'+r[1]+'">'+r[0]+'<small>'+r[2]+'</small></button></div>'}).join('')+'<div class="row"><button id="cl">나가기</button></div>';
 hookSheet();setTimeout(function(){say(g)},250);
 [].forEach.call(sheet.querySelectorAll('.main'),function(b){b.onclick=function(){openGame(b.getAttribute('data-g'))}})}
var gov=document.getElementById('gameov'),gback=document.getElementById('gback');
function openGame(k){sheet.style.display='none';gov.style.display='block';gback.style.display='block';
 if(k=='grammar')G.startGram();else if(k=='dialog')G.startDial();else{G.menu();setTimeout(function(){G.scroll(k=='test'?'ht':'hp')},80)}}
gback.addEventListener('click',function(){gov.style.display='none';gback.style.display='none';hud();sheet.style.display='block';lessons()});
function office(){var g='Здравствуйте! Заходите, пожалуйста.';
 sheet.innerHTML='<h2>🗂️ 교무실 (Учительская)</h2><div class="npc"><div class="av">🧑‍🏫</div><div class="bub"><b>'+g+'</b><small>'+rom(g)+'</small><small>안녕하세요! 들어오세요.</small></div></div><div class="msg">선생님과 어떤 이야기를 해 볼까요?</div>'+
 OFFICE.map(function(s,i){return '<div class="opt"><button class="main" data-i="'+i+'">'+s.e+' '+s.t+'<small>'+s.steps.length+'단계 상황극</small></button></div>'}).join('')+'<div class="row"><button id="cl">나가기</button></div>';
 hookSheet();setTimeout(function(){say(g)},250);
 [].forEach.call(sheet.querySelectorAll('.main'),function(b){b.onclick=function(){var i=+b.getAttribute('data-i'),s=OFFICE[i];runScene({id:'of'+i,title:s.e+' '+s.t,npc:'🧑‍🏫',steps:s.steps,back:office},0,0)}})}
function runScene(S,i,miss){var st=S.steps[i];
 sheet.innerHTML='<h2>'+S.title+' ('+(i+1)+'/'+S.steps.length+')</h2><div class="npc"><div class="av">'+S.npc+'</div><div class="bub"><b>'+st.npc+'</b><small>'+st.rom+'</small><small>'+st.ko+'</small></div></div><div class="msg" id="m">알맞은 대답을 고르세요</div>'+
 st.o.map(function(o,k){return '<div class="opt"><button class="main" data-k="'+k+'">'+o[0]+'<small>'+o[1]+' · '+o[2]+'</small></button><button class="snd" data-t="'+o[0]+'">🔊</button></div>'}).join('')+'<div class="row"><button id="cl">나가기</button></div>';
 hookSheet();sheet.scrollTop=0;setTimeout(function(){say(st.npc)},250);
 [].forEach.call(sheet.querySelectorAll('.main'),function(b){b.onclick=function(){var o=st.o[+b.getAttribute('data-k')],m=document.getElementById('m');
  if(o[3]){[].forEach.call(sheet.querySelectorAll('.main'),function(x){x.disabled=true});b.style.background='#b2f2bb';m.style.color='#b2f2bb';m.textContent='✅ 좋아요!';
   say(o[0],function(){setTimeout(function(){if(i+1<S.steps.length)runScene(S,i+1,miss);else end(S,miss)},500)})}
  else{miss++;b.disabled=true;b.style.opacity=.55;m.style.color='#ffc9c9';m.textContent='❌ 이 상황에는 어울리지 않아요. 다시 골라 보세요'}}})}
function end(S,miss){var g=Math.max(1,3-miss);try{G.rec('sc:'+S.id,miss==0)}catch(e){}hud();
 sheet.innerHTML='<h2>'+S.title+' · 성공!</h2><div class="npc"><div class="av">🎉</div><div class="bub"><b>'+'⭐'.repeat(g)+'</b><small>틀린 횟수 '+miss+'번'+(miss==0?' · 한 번에 성공!':'')+'</small><small>이 결과가 경험치에 반영됐어요. (상황극 하나는 단어 하나와 같은 1점 만점이에요)</small></div></div><div class="row"><button id="again">다시 하기</button><button id="back" class="p">돌아가기</button></div>';
 document.getElementById('again').onclick=function(){runScene(S,0,0)};document.getElementById('back').onclick=function(){S.back()}}

 var shim={getElementById:function(i){return root.getElementById(i)},querySelectorAll:function(q){return root.querySelectorAll(q)},createElement:function(t){return document.createElement(t)},body:root.querySelector('.gwrap')};
 try{G=GAMEINIT(shim)}catch(e){G=null;console.error(e)}
